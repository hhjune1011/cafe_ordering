<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단 -->
  <header>
    <div aria-hidden="true">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>

    <!-- 주문서와 주문 내역을 전환하는 탭 메뉴 -->
    <nav class="tabs" aria-label="주문 메뉴">
      <button type="button" class="tab-button" id="order-tab" aria-controls="order-panel" aria-selected="true">☕ 주문하기</button>
      <button type="button" class="tab-button" id="history-tab" aria-controls="history-panel" aria-selected="false">
        📋 주문 내역 <span id="order-count">0</span>
      </button>
    </nav>
  </header>

  <!-- 탭 내용 -->
  <main>
    <!-- 주문하기 탭 -->
    <section id="order-panel" class="tab-panel" aria-labelledby="order-tab">
      <form id="order-form" novalidate>
      <div>
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" required>
      </div>

      <div>
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" name="phone">
      </div>

      <div>
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="americano" data-price="3500">아메리카노 3,500원</option>
          <option value="cafe-latte" data-price="4000">카페라떼 4,000원</option>
          <option value="cafe-mocha" data-price="4500">카페모카 4,500원</option>
          <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
          <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
        </select>
      </div>

      <fieldset>
        <legend>사이즈</legend>
        <input type="radio" id="size-s" name="size" value="S" data-price="0">
        <label for="size-s">S +0원</label>

        <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
        <label for="size-m">M +500원</label>

        <input type="radio" id="size-l" name="size" value="L" data-price="1000">
        <label for="size-l">L +1,000원</label>
      </fieldset>

      <fieldset>
        <legend>추가 옵션</legend>
        <input type="checkbox" id="extra-shot" name="options" value="shot" data-price="500">
        <label for="extra-shot">샷 추가 +500원</label>

        <input type="checkbox" id="extra-cream" name="options" value="cream" data-price="500">
        <label for="extra-cream">크림 추가 +500원</label>

        <input type="checkbox" id="extra-syrup" name="options" value="syrup" data-price="300">
        <label for="extra-syrup">시럽 추가 +300원</label>

        <input type="checkbox" id="decaf" name="options" value="decaf" data-price="0">
        <label for="decaf">디카페인 +0원</label>
      </fieldset>

      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <div>
        <label for="requests">요청사항</label>
        <textarea id="requests" name="requests"></textarea>
      </div>

      <!-- 예상 금액과 주문 버튼 -->
      <p id="estimated-price">예상 금액: 0원</p>
      <button type="submit">주문하기</button>
      <button type="reset">다시 작성</button>

      <!-- 주문 완료 후 표시할 영역 -->
        <div id="order-message" class="hidden"></div>
      </form>
    </section>

    <!-- 주문 내역 탭 -->
    <section id="history-panel" class="tab-panel hidden" aria-labelledby="history-tab">
      <h2>주문 내역</h2>
      <p id="empty-orders">아직 주문 내역이 없어요 ☕</p>
      <div id="order-list"></div>

      <div id="order-summary" class="hidden">
        <p id="order-total">총 주문 금액: 0원 (0건)</p>
        <button type="button" id="clear-orders">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase 라이브러리를 먼저 불러온 뒤 주문 기능을 실행합니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
